<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nexus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f0519">
  <link rel="apple-touch-icon" href="https://data.wolfethyst.tv/assets/nexus_icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://data.wolfethyst.tv">
  
  <link rel="icon" type="image/png" href="https://data.wolfethyst.tv/assets/nexus_icon">

  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cinzel:wght@400;600;700&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mobile.css" media="(max-width: 1000px)">
</head>
<body>

  <div id="appLoader">
    <div class="loader-content">
      <img src="https://data.wolfethyst.tv/assets/nexus_icon" alt="Loading..." class="loader-icon">
      <div class="loader-text">Initializing Nexus...</div>
      <div class="loader-bar"><div class="loader-progress"></div></div>
    </div>
  </div>

  <header>
    <div class="user-area" id="loginArea">
        <div class="avatar-frame" id="avatarContainer">
            </div>
        <div class="user-info-text">
            <div class="username-display" id="headerDisplayName">Guest</div>
            <div class="crystals">
                <img src="https://data.wolfethyst.tv/assets/wolfe_crystal" width="14">
                <span id="headerPoints">0</span>
            </div>
        </div>
    </div>
    
    <div class="nav-tabs">
        <button id="viewBtnLive" class="nav-tab active" onclick="toggleMainView('live')">LIVE</button>
        <button id="viewBtnVideo" class="nav-tab" onclick="toggleMainView('video')">VODS</button>
        <button id="viewBtnStore" class="nav-tab" onclick="toggleStoreView()">STORE</button>
    </div>

    <div class="brand">
        NEXUS
        <img src="https://data.wolfethyst.tv/assets/nexus_icon" width="28">
    </div>
  </header>

  <div class="main-grid">

    <div class="col-left live-view">
        
        <div class="now-playing-card" id="nowPlayingCard">
            <img id="gameCoverImage" src="https://images.igdb.com/igdb/image/upload/t_cover_big/co85cg.jpg" class="game-cover" onerror="this.src='https://data.wolfethyst.tv/assets/nexus_icon'">
            <div class="game-info-overlay">
                <div class="game-label">Current Session</div>
                <div class="game-title" id="streamGameLabel">Loading...</div>
                <div class="game-meta" id="streamTitleLabel">Stream Title</div>
            </div>
            <div class="adminOnly" style="position:absolute; top:10px; right:10px; display:flex; gap:5px;">
                <button onclick="document.getElementById('streamTitleInput').focus()" class="panelSmallBtn">✎</button>
            </div>
        </div>

        <div class="panel" id="leaderboardPanel" style="flex:1;">
            <div class="panel-header">All-Time Top Crystals</div>
            <div class="panel-body" id="leaderboard">
                </div>
        </div>

        <div id="playedPanel" style="display:none;">
            <div id="gamesPlayed"></div>
        </div>
    </div>

    <div class="col-center live-view">
        
        <div class="stream-wrapper" id="streamPanel">
            <div class="streamOuter">
                <iframe id="stream-player" src="https://customer-gc5hjo8ti1eiebgs.cloudflarestream.com/b58b43ebaa1f57a6f55f861b9b366726/iframe" allow="autoplay; picture-in-picture;" allowfullscreen="true"></iframe>
            </div>
        </div>

        <div class="adminOnly" style="background:rgba(0,0,0,0.5); padding:10px; border-radius:8px; display:flex; gap:10px;">
            <input id="streamTitleInput" type="text" placeholder="Title" class="panelInput" style="flex:1;">
            <input id="streamGameInput" type="text" placeholder="Game" class="panelInput" style="width:120px;">
            <button id="streamTitleSaveBtn" class="panelSmallBtn">Save</button>
            <button id="clipBtn" class="panelSmallBtn">🎬 Clip</button>
        </div>

        <div class="panel" style="flex:1; min-height: 200px;">
            <div class="panel-header">
                <span>Quick Redeems</span>
                <span style="font-size:11px; opacity:0.7; font-family:'Marcellus';">Interact with the stream</span>
            </div>
            <div class="panel-body">
                <div id="redeemContent" class="redeems-grid"></div> 
            </div>
        </div>
    </div>

    <div id="marketplacePanel" class="panel glass-panel hidden" style="position:absolute; inset:80px 20px 20px 20px; z-index:100;">
        <div class="market-header">
            <div class="market-tabs-group">
                <button class="market-tab active" id="tabStoreBtn" onclick="switchMarketTab('store')">Store</button>
                <button class="market-tab" id="tabInvBtn" onclick="switchMarketTab('inventory')">Inventory</button>
                <button class="market-tab" onclick="toggleStoreView()">Close ✕</button>
            </div>
            <div class="market-controls-right">
                <button id="storeSortBtn" class="panelSmallBtn" style="margin-right:8px; min-width:80px;" onclick="toggleStoreSort()">Price ⬆</button>
                <div class="market-search"><input id="storeSearchInput" type="text" placeholder="Search..." /></div>
            </div>
        </div>
        <div class="panel-body">
            <div id="storeGrid" class="store-grid-layout"></div>
            <div id="storeGridLegacy" style="display:none;"></div>
        </div>
    </div>

    <div class="col-video video-view hidden">
        <div id="videoStage" class="panel video-player-section hidden" style="margin-bottom: 20px;">
            <div class="video-container">
                <video id="main-video-player" controls crossorigin="anonymous" style="width:100%; height:100%; object-fit:contain;"></video>
            </div>
            <div class="meta-panel">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <span id="meta-tag" class="meta-tag">Clip</span>
                        <h2 id="meta-title" class="meta-title">Title</h2>
                        <div id="meta-date" class="meta-date">Date</div>
                    </div>
                    <div class="actions">
                        <select id="videoQualitySelect" class="panelSmallBtn" style="background:rgba(0,0,0,0.5); display:none;">
                            <option value="-1">Auto</option>
                        </select>
                        <button id="btn-share" class="panelSmallBtn" onclick="shareActiveVideo()">Share</button>
                        <a id="btn-download" href="#" class="panelSmallBtn" download>Download</a>
                        <button class="panelSmallBtn" onclick="closeVideoStage()">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
            <div id="hub-home-view" class="video-hub-container">
                <div style="padding:15px; border-bottom:1px solid var(--panel-border);">
                    <h2 style="margin:0; font-family:'Cinzel';">Library</h2>
                </div>
                <div id="hubGamesGrid" class="hub-games-grid" style="padding:20px;"></div>
            </div>
            <div id="hub-details-view" class="video-hub-container hidden" style="display:flex; flex-direction:column; height:100%;">
                <div class="game-hero">
                    <div class="game-hero-bg" id="heroBg"></div>
                    <button class="hub-back-btn" onclick="openHubHome()">← Back</button>
                    <div class="game-hero-content">
                        <img id="heroCover" class="game-hero-cover" src="">
                        <div class="game-hero-main">
                            <h1 id="heroTitle" class="game-hero-title">Game</h1>
                            <div class="game-hero-stats">
                                <span class="game-hero-stat">📼 <span id="heroVodCount">0</span> VODs</span>
                                <span class="game-hero-stat">🎬 <span id="heroClipCount">0</span> Clips</span>
                            </div>
                            <a id="heroSteamBtn" class="game-steam-btn hidden" href="#" target="_blank">
                                <img src="https://store.steampowered.com/favicon.ico" style="width:14px;height:14px;">
                                View on Steam
                            </a>
                        </div>
                    </div>
                </div>
                <div class="hub-tabs">
                    <button class="hub-tab active" onclick="switchHubTab('vods')">Broadcasts</button>
                    <button class="hub-tab" onclick="switchHubTab('videos')">Videos</button>
                    <button class="hub-tab" onclick="switchHubTab('clips')">Clips</button>
                </div>
                <div class="hub-scroll-wrapper" style="flex:1; overflow-y:auto; padding:20px;">
                    <div id="hub-content-vods" class="video-grid"></div>
                    <div id="hub-content-videos" class="video-grid hidden"></div>
                    <div id="hub-content-clips" class="video-grid hidden"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-right">
        <div class="panel" id="chatPanelWrapper" style="height:100%;">
            <div class="panel-header">
                <span>Live Chat</span>
                <span id="liveStatusTag" style="opacity:0.5; font-size:12px;">● Offline</span>
                <button id="clearChatBtn" class="panelSmallBtn adminOnly">Clear</button>
            </div>
            
            <div id="chatPanel" class="chat-messages"></div>

            <div class="chat-footer">
                <form id="dashboardChatForm" style="width:100%;">
                    <input id="dashboardChatInput" type="text" class="chat-input" placeholder="Send a message..." autocomplete="off">
                </form>
                
                <div class="support-actions">
                    <button id="openTipModalBtn" class="support-btn btn-tip">💎 Tip</button>
                    <button id="openSubModalBtn" class="support-btn btn-sub">⭐ Subscribe</button>
                </div>
            </div>
        </div>
    </div>

  </div>

  <div id="settingsModal" class="requestModal">
      <div class="requestModalWindow">
        <h3>Settings</h3>
        <button class="panelSmallBtn" onclick="setTheme('default')">Default Theme</button>
        <button class="panelSmallBtn" onclick="setTheme('light')">Light Theme</button>
        <div style="margin-top:10px;">
            <label><input type="checkbox" id="decoToggle" checked onchange="toggleDecorations(this.checked)"> Show Decorations</label>
        </div>
        <button class="panelSmallBtn" onclick="document.getElementById('settingsModal').classList.remove('open')">Close</button>
      </div>
  </div>

  <div id="vodEditModal" class="requestModal">
      <div class="requestModalWindow">
        <h3>Edit VOD</h3>
        <input type="hidden" id="editVodId">
        <input type="text" id="editVodTitle" placeholder="Title" class="panelInput">
        <input type="text" id="editVodGame" placeholder="Game" class="panelInput">
        <div class="requestModalButtons">
            <button id="saveVodBtn">Save</button>
            <button onclick="document.getElementById('vodEditModal').classList.remove('open')">Cancel</button>
        </div>
      </div>
  </div>

  <div id="gameInfoModal" class="requestModal">
      <div class="requestModalWindow">
      <h3 id="gameInfoTitle">Game</h3>
      <div id="gameInfoBody" class="game-info-body" style="display:none;">
        <img id="gameInfoCover" class="game-info-cover" alt="">
        <div id="gameInfoText" class="game-info-text"></div>
      </div>
      <div class="requestModalButtons">
        <a id="gameSteamBtn" class="panelSmallBtn" href="#" target="_blank" rel="noopener" style="display:none;">Steam</a>
        <button id="gameInfoCloseBtn" class="panelSmallBtn">Close</button>
      </div>
    </div>
  </div>

  <div id="tipOverlay" class="chat-overlay hidden">
       <div class="chat-card">
          <div class="chat-card-header">
              <h3>Send a Tip</h3>
              <button class="modal-close-btn-embedded" onclick="toggleTipModal(false)">×</button>
          </div>
          <div class="tip-input-group">
              <button class="tip-preset" onclick="selectTipAmount(3)">$3</button>
              <button class="tip-preset" onclick="selectTipAmount(5)">$5</button>
              <button class="tip-preset" onclick="selectTipAmount(10)">$10</button>
              <input id="tipCustomInput" class="tip-custom-input" type="number" placeholder="$ Custom" />
          </div>
          <div id="tipCardSection">
              <div id="tipCardElement"></div>
              <button id="tipCheckoutBtn" class="cta-button" style="margin-top:10px;">Pay</button>
          </div>
       </div>
   </div>

   <div id="redeemDrawer" style="display:none;"><div id="redeemDrawerInner"></div></div>

  <script src="https://js.stripe.com/v3/"></script>
  <script type="module" src="app.js"></script>
  <script src="mobile.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch((err) => console.log("SW Failed:", err));
      });
    }
    
    // View Switcher Logic
    window.toggleMainView = (mode) => {
        document.querySelectorAll('.live-view').forEach(el => el.classList.toggle('hidden', mode !== 'live'));
        document.querySelectorAll('.video-view').forEach(el => el.classList.toggle('hidden', mode !== 'video'));
        document.getElementById('marketplacePanel').classList.add('hidden');
        
        document.getElementById('viewBtnLive').classList.toggle('active', mode === 'live');
        document.getElementById('viewBtnVideo').classList.toggle('active', mode === 'video');
        document.getElementById('viewBtnStore').classList.remove('active');
    };

    window.toggleStoreView = () => {
        const panel = document.getElementById('marketplacePanel');
        const isActive = !panel.classList.contains('hidden');
        if(isActive) {
            panel.classList.add('hidden');
            document.getElementById('viewBtnStore').classList.remove('active');
        } else {
            panel.classList.remove('hidden');
            document.getElementById('viewBtnStore').classList.add('active');
        }
    };
    
    // Initial State
    toggleMainView('live');
  </script>
</body>
</html>
