name: Type Check

on:
  push:
  pull_request:

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm -r --filter @nexus/shared build

      - name: Type check shared
        run: pnpm -r --filter @nexus/shared type-check

      - name: Type check backend
        run: pnpm -r --filter @nexus/backend type-check

      - name: Type check frontend
        run: pnpm -r --filter @nexus/frontend type-check

      - name: Lint Frontend
        run: pnpm -r --filter @nexus/frontend lint
