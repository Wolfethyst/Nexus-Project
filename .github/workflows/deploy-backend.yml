name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm -r --filter @nexus/shared build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LOGTO_CLIENT_SECRET: ${{ secrets.LOGTO_CLIENT_SECRET }}
          LOGTO_COOKIE_SECRET: ${{ secrets.LOGTO_COOKIE_SECRET }}
        run: |
          cd packages/backend
          wrangler secret put LOGTO_CLIENT_SECRET --env production <<< "$LOGTO_CLIENT_SECRET"
          wrangler secret put LOGTO_COOKIE_SECRET --env production <<< "$LOGTO_COOKIE_SECRET"
          npx wrangler deploy --env production
