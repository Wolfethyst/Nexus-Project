<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tala Overlay – Nexus Alerts</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --accent:#9f6cff;
    --text:#fff;
    --box1:rgba(40,20,80,.35);
    --box2:rgba(20,10,40,.35);
  }
  html,body{
    margin:0;padding:0;background:transparent;width:100%;height:100%;overflow:hidden;
    color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
  }

  /* Audio Enable Overlay */
  #audioPrompt {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    backdrop-filter: blur(8px);
    cursor: pointer;
    transition: opacity 300ms ease-out;
  }
  #audioPrompt.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .prompt-content {
    text-align: center;
    padding: 40px;
    background: linear-gradient(135deg, rgba(159, 108, 255, 0.2), rgba(60, 20, 120, 0.3));
    border: 2px solid rgba(159, 108, 255, 0.5);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(159, 108, 255, 0.3);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }
  .prompt-content h1 {
    font-family: 'Cinzel', serif;
    font-size: 32px;
    margin: 0 0 16px 0;
    color: #9f6cff;
    text-shadow: 0 0 20px rgba(159, 108, 255, 0.8);
  }
  .prompt-content p {
    font-size: 18px;
    margin: 0;
    color: #e9d9ff;
    opacity: 0.9;
  }

  /* init screen removed for Meld integration */

  .cornerGlow{
    position:absolute;bottom:0;right:0;width:70vw;height:70vh;
    background:radial-gradient(circle at bottom right,rgba(120,60,255,.4) 0%,rgba(60,20,120,.15) 40%,transparent 80%);
    filter:blur(120px);animation:cg 10s ease-in-out infinite;z-index:0;pointer-events:none;
  }
  @keyframes cg{0%,100%{opacity:.2}50%{opacity:.6}}

  .overlay-root{
    position:absolute;inset:0;
    opacity:0;
    transition:opacity 300ms ease-in-out;
    pointer-events:none;
  }
  .overlay-root.visible{
    opacity:1;
  }

  .crystal-wrap{
    position:absolute;bottom:3%;right:3%;width:280px;height:280px;
    display:grid;place-items:center;z-index:1;
  }
  .aura{
    position:absolute;width:350px;height:350px;border-radius:50%;
    background:radial-gradient(circle,rgba(180,100,255,.5) 0%,rgba(130,70,255,.25) 30%,rgba(90,50,180,.12) 60%,transparent 100%);
    filter:blur(80px);animation:auraPulse 8s ease-in-out infinite;z-index:0;pointer-events:none;
  }
  @keyframes auraPulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.85;transform:scale(1.08)}}
  .crystal{
    position:relative;width:250px;animation:float 6s ease-in-out infinite;z-index:2;
    filter:drop-shadow(0 0 20px rgba(180,80,255,.4));
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}

  .caption-wrap{
    position:absolute;right:calc(3% + 270px);bottom:11%;max-width:40vw;z-index:3;
  }
  .caption-box{
    padding:14px 18px;border-radius:14px;
    background:linear-gradient(180deg,var(--box1),var(--box2));
    border:1px solid rgba(180,120,255,.35);
    box-shadow:0 0 24px rgba(140,80,255,.25),inset 0 0 24px rgba(180,120,255,.15);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity: 0.95;
  }
  .caption-title{
    font-family:Cinzel,serif;font-weight:700;letter-spacing:.04em;font-size:14px;
    color:#e9d9ff;text-shadow:0 0 10px rgba(160,80,255,.5);
    margin:0 0 6px;display:flex;align-items:center;gap:8px;
  }
  .title-dot{
    width:8px;height:8px;border-radius:999px;background:var(--accent);
    box-shadow:0 0 16px var(--accent);
  }
  .caption-text{
    font-size:20px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word;
    text-shadow:0 0 10px rgba(80,40,160,.55);min-height:1.2em;
  }

  /* Visual Flash for Debugging */
  @keyframes flash { 0% { box-shadow: inset 0 0 0 transparent; } 50% { box-shadow: inset 0 0 50px rgba(255,255,255,0.3); } 100% { box-shadow: inset 0 0 0 transparent; } }
  .flash-trigger { animation: flash 0.3s ease-out; }

  /* Twitch Alert Styles */
  .alert-container {
    position: fixed;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    pointer-events: none;
  }
  .alert-box {
    min-width: 550px;
    padding: 35px 45px;
    background: linear-gradient(135deg, rgba(60, 20, 120, 0.95), rgba(40, 15, 80, 0.95));
    border: 2px solid rgba(159, 108, 255, 0.6);
    border-radius: 16px;
    box-shadow: 0 0 80px rgba(159, 108, 255, 0.6), 
                0 0 120px rgba(120, 60, 255, 0.4),
                inset 0 0 60px rgba(159, 108, 255, 0.15);
    text-align: center;
    opacity: 0;
    transform: scale(0.85) translateY(-60px);
    animation: alertSlideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    backdrop-filter: blur(12px);
    position: relative;
    overflow: hidden;
  }
  .alert-box::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(159, 108, 255, 0.15) 0%, transparent 70%);
    animation: alertGlow 3s ease-in-out infinite;
  }
  @keyframes alertGlow {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(10%, 10%); }
  }
  @keyframes alertSlideIn {
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }
  .alert-box.hiding {
    animation: alertSlideOut 0.5s ease-in forwards;
  }
  @keyframes alertSlideOut {
    to {
      opacity: 0;
      transform: scale(0.9) translateY(-40px);
    }
  }
  .alert-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }
  .alert-user {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 5px;
  }
  .alert-avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 3px solid rgba(159, 108, 255, 0.8);
    box-shadow: 0 0 25px rgba(159, 108, 255, 0.6);
    animation: avatarPulse 2s ease-in-out infinite;
  }
  @keyframes avatarPulse {
    0%, 100% { box-shadow: 0 0 25px rgba(159, 108, 255, 0.6); }
    50% { box-shadow: 0 0 40px rgba(159, 108, 255, 0.9); }
  }
  .alert-title {
    font-family: 'Cinzel', serif;
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 40px rgba(159, 108, 255, 1), 
                 0 0 20px rgba(255, 255, 255, 0.8),
                 0 3px 6px rgba(0, 0, 0, 0.6);
    margin: 0;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .alert-message {
    font-size: 22px;
    color: #e9d9ff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5),
                 0 0 20px rgba(159, 108, 255, 0.4);
    margin: 0;
    line-height: 1.4;
  }
  .alert-highlight {
    color: #c9a0ff;
    font-weight: 600;
    font-size: 26px;
    text-shadow: 0 0 25px rgba(201, 160, 255, 0.9),
                 0 0 15px rgba(255, 255, 255, 0.6);
  }

  @media (max-width:1200px){
    .caption-wrap{right:5%;bottom:calc(5% + 360px);max-width:90vw}
    .alert-box { min-width: 350px; padding: 25px 30px; }
    .alert-avatar { width: 60px; height: 60px; }
    .alert-icon { font-size: 64px; }
    .alert-title { font-size: 24px; }
    .alert-message { font-size: 18px; }
    .alert-highlight { font-size: 20px; }
  }
</style>
</head>

<body>

<!-- Audio Enable Prompt -->
<div id="audioPrompt">
  <div class="prompt-content">
    <h1>🔊 Audio Ready</h1>
    <p>Click anywhere to enable TTS & sound alerts</p>
  </div>
</div>

<!-- init screen removed for Meld integration -->

<!-- Twitch Alerts Container -->
<div class="alert-container" id="alertContainer"></div>

<div class="overlay-root" id="overlayRoot">
  <div class="cornerGlow"></div>
  <div class="crystal-wrap">
    <div class="aura"></div>
    <img class="crystal" src="https://data.wolfethyst.tv/assets/tala_crystal" alt="Talathyst Crystal">
  </div>
  <div class="caption-wrap">
    <div class="caption-box">
      <div class="caption-title">
        <span class="title-dot"></span> Talathyst
      </div>
      <div id="captionText" class="caption-text">Awaiting connection…</div>
    </div>
  </div>
</div>

<script>
/** ================= CONFIG ================== **/
const WS_URL          = "wss://data.wolfethyst.tv/nexus/chat/stream";
const API_BASE        = "https://data.wolfethyst.tv"; 
const TWITCH_EVENTSUB_WS_URL = "wss://eventsub.wss.twitch.tv/ws";

const USE_TYPEWRITER        = true;
const TYPE_SPEED_MS         = 18;
const OVERLAY_HIDE_DELAY_MS = 3000;
const ALERT_DISPLAY_TIME_MS = 6000; 

/** ============== ELEMENTS =================== **/
const overlayRoot = document.getElementById("overlayRoot");
const captionEl   = document.getElementById("captionText");
const alertContainer = document.getElementById("alertContainer");

/** ============ STATE / QUEUE ================ **/
let chatWs = null;
let twitchEventSubWs = null;
let twitchSessionId = null;
let twitchAccessToken = null;
let typing = false;
let processingQueue = false;
let audioEnabled = false; 
const talaQueue = [];
let resolveCurrentAudio = null;
const activeAlerts = [];
const alertSettings = {
  follow: true,
  subscribe: true,
  gift: true,
  cheer: true,
  raid: true,
  channel_points: true
}; 

/** ============== HELPERS ==================== **/
const delay = (ms) => new Promise(res => setTimeout(res, ms));

// Force audio enabled on click
function enableAudio() {
  if (audioEnabled) return;
  audioEnabled = true;
  console.log("[Nexus] Audio Engine Enabled");
  
  // Create AudioContext to unlock audio on iOS/Safari
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume().then(() => console.log("[Nexus] AudioContext Started"));
  
  // Hide the prompt
  const prompt = document.getElementById("audioPrompt");
  if (prompt) {
    prompt.classList.add("hidden");
    setTimeout(() => prompt.remove(), 300);
  }
}

function showOverlay() { overlayRoot.classList.add("visible"); }
function hideOverlay() { overlayRoot.classList.remove("visible"); }

function triggerVisualFlash() {
    document.body.classList.remove("flash-trigger");
    void document.body.offsetWidth; // force reflow
    document.body.classList.add("flash-trigger");
}

function clamp01(v) {
  v = Number(v); return Number.isNaN(v) ? 1 : (v < 0 ? 0 : (v > 1 ? 1 : v));
}

async function typeOut(text) {
  typing = true;
  captionEl.textContent = "";
  if (!USE_TYPEWRITER) {
    captionEl.textContent = text;
    typing = false;
    return;
  }
  for (let i = 0; i < text.length; i++) {
    captionEl.textContent += text[i];
    await delay(TYPE_SPEED_MS);
  }
  typing = false;
}

// --- TWITCH ALERTS ---

async function showTwitchAlert(type, data) {
  // Check if alert type is enabled
  const settingKey = type === 'subscription.gift' ? 'gift' : type;
  if (alertSettings[settingKey] === false) {
    console.log(`[Alert] ${type} alerts disabled, skipping`);
    return;
  }
  
  const alertBox = document.createElement('div');
  alertBox.className = 'alert-box';
  
  let title = 'Alert';
  let message = '';
  let soundUrl = null;
  let userName = '';
  let userId = '';
  
  switch(type) {
    case 'follow':
      title = 'New Follower';
      userName = data.user_name;
      userId = data.user_id;
      message = `<span class="alert-highlight">${userName}</span> is now following!`;
      soundUrl = null; // Add your follow sound URL here
      break;
      
    case 'subscribe':
      title = 'New Subscriber';
      userName = data.user_name;
      userId = data.user_id;
      const tier = data.tier === '3000' ? 'Tier 3' : data.tier === '2000' ? 'Tier 2' : 'Tier 1';
      message = `<span class="alert-highlight">${userName}</span> subscribed at ${tier}!`;
      soundUrl = null; // Add your sub sound URL here
      break;
      
    case 'subscription.gift':
      title = 'Gift Sub';
      userName = data.user_name;
      userId = data.user_id;
      message = `<span class="alert-highlight">${userName}</span> gifted ${data.total} sub${data.total > 1 ? 's' : ''}!`;
      soundUrl = null;
      break;
      
    case 'cheer':
      title = 'Bits';
      userName = data.user_name;
      userId = data.user_id;
      message = `<span class="alert-highlight">${userName}</span> cheered ${data.bits} bits!`;
      soundUrl = null; // Add your bits sound URL here
      break;
      
    case 'raid':
      title = 'Raid';
      userName = data.from_broadcaster_user_name;
      userId = data.from_broadcaster_user_id;
      message = `<span class="alert-highlight">${userName}</span> raided with ${data.viewers} viewers!`;
      soundUrl = null; // Add your raid sound URL here
      break;
      
    case 'channel_points':
      title = 'Channel Points';
      userName = data.user_name;
      userId = data.user_id;
      message = `<span class="alert-highlight">${userName}</span> redeemed ${data.reward.title}!`;
      soundUrl = null;
      break;
  }
  
  // Fetch user avatar
  let avatarHtml = '';
  if (userId && twitchAccessToken) {
    try {
      const userResponse = await fetch(`https://api.twitch.tv/helix/users?id=${userId}`, {
        headers: {
          'Authorization': `Bearer ${twitchAccessToken}`,
          'Client-Id': await getTwitchClientId()
        }
      });
      const userData = await userResponse.json();
      if (userData.data && userData.data[0]) {
        const avatarUrl = userData.data[0].profile_image_url;
        avatarHtml = `<div class="alert-user"><img class="alert-avatar" src="${avatarUrl}" alt="${userName}"></div>`;
      }
    } catch (e) {
      console.warn('[Alert] Failed to fetch avatar:', e);
    }
  }
  
  alertBox.innerHTML = `
    <div class="alert-content">
      ${avatarHtml}
      <h2 class="alert-title">${title}</h2>
      <p class="alert-message">${message}</p>
    </div>
  `;
  
  alertContainer.appendChild(alertBox);
  activeAlerts.push(alertBox);
  
  // Play sound if available
  if (soundUrl && audioEnabled) {
    playAlertSound({ url: soundUrl });
  }
  
  // Auto-remove after display time
  setTimeout(() => {
    alertBox.classList.add('hiding');
    setTimeout(() => {
      if (alertContainer.contains(alertBox)) {
        alertContainer.removeChild(alertBox);
      }
      const idx = activeAlerts.indexOf(alertBox);
      if (idx > -1) activeAlerts.splice(idx, 1);
    }, 400);
  }, ALERT_DISPLAY_TIME_MS);
  
  console.log(`[Twitch Alert] ${type}:`, data);
}

async function getTwitchAccessToken() {
  try {
    const response = await fetch(`${API_BASE}/twitch/eventsub-token`, { credentials: 'include' });
    const data = await response.json();
    if (data.accessToken) {
      return data.accessToken;
    }
    if (data.error) {
      console.warn('[Twitch] ' + data.error);
    }
  } catch (e) {
    console.error('[Twitch] Failed to get access token:', e);
  }
  return null;
}

function connectTwitchEventSub() {
  if (twitchEventSubWs) return;
  
  try {
    twitchEventSubWs = new WebSocket(TWITCH_EVENTSUB_WS_URL);
  } catch (e) {
    console.error('[Twitch EventSub] Connection failed:', e);
    return;
  }
  
  twitchEventSubWs.onopen = () => {
    console.log('[Twitch EventSub] WebSocket connected');
  };
  
  twitchEventSubWs.onmessage = async (event) => {
    const message = JSON.parse(event.data);
    const messageType = message.metadata.message_type;
    
    switch(messageType) {
      case 'session_welcome':
        twitchSessionId = message.payload.session.id;
        console.log('[Twitch EventSub] Session established:', twitchSessionId);
        
        // Get access token and subscribe to events
        twitchAccessToken = await getTwitchAccessToken();
        if (twitchAccessToken) {
          await subscribeToTwitchEvents();
        } else {
          console.warn('[Twitch EventSub] No access token - alerts disabled. Please connect Twitch account.');
        }
        break;
        
      case 'session_keepalive':
        // Just acknowledge keepalive
        break;
        
      case 'notification':
        handleTwitchNotification(message.payload);
        break;
        
      case 'session_reconnect':
        // Reconnect to new URL if provided
        console.log('[Twitch EventSub] Reconnecting...');
        const reconnectUrl = message.payload.session.reconnect_url;
        if (reconnectUrl) {
          twitchEventSubWs.close();
          twitchEventSubWs = null;
          setTimeout(() => connectTwitchEventSub(), 1000);
        }
        break;
    }
  };
  
  twitchEventSubWs.onerror = (error) => {
    console.error('[Twitch EventSub] Error:', error);
  };
  
  twitchEventSubWs.onclose = () => {
    console.log('[Twitch EventSub] Disconnected, reconnecting in 5s...');
    twitchEventSubWs = null;
    twitchSessionId = null;
    setTimeout(connectTwitchEventSub, 5000);
  };
}

async function subscribeToTwitchEvents() {
  if (!twitchAccessToken || !twitchSessionId) return;
  
  // Get broadcaster ID from token
  const userResponse = await fetch('https://api.twitch.tv/helix/users', {
    headers: {
      'Authorization': `Bearer ${twitchAccessToken}`,
      'Client-Id': await getTwitchClientId()
    }
  });
  
  const userData = await userResponse.json();
  const broadcasterId = userData.data[0].id;
  
  console.log('[Twitch EventSub] Subscribing to events for broadcaster:', broadcasterId);
  
  // Subscribe to follow events (version 2)
  await createEventSubSubscription('channel.follow', {
    broadcaster_user_id: broadcasterId,
    moderator_user_id: broadcasterId
  }, '2');
  
  // Subscribe to subscription events
  await createEventSubSubscription('channel.subscribe', {
    broadcaster_user_id: broadcasterId
  });
  
  // Subscribe to gift subscription events
  await createEventSubSubscription('channel.subscription.gift', {
    broadcaster_user_id: broadcasterId
  });
  
  // Subscribe to cheer events
  await createEventSubSubscription('channel.cheer', {
    broadcaster_user_id: broadcasterId
  });
  
  // Subscribe to raid events
  await createEventSubSubscription('channel.raid', {
    to_broadcaster_user_id: broadcasterId
  });
  
  // Subscribe to channel point redemptions
  await createEventSubSubscription('channel.channel_points_custom_reward_redemption.add', {
    broadcaster_user_id: broadcasterId
  });
}

async function createEventSubSubscription(type, condition, version = '1') {
  try {
    const response = await fetch('https://api.twitch.tv/helix/eventsub/subscriptions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${twitchAccessToken}`,
        'Client-Id': await getTwitchClientId(),
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        type: type,
        version: version,
        condition: condition,
        transport: {
          method: 'websocket',
          session_id: twitchSessionId
        }
      })
    });
    
    if (response.ok) {
      console.log(`[Twitch EventSub] Subscribed to ${type}`);
    } else {
      const error = await response.text();
      console.error(`[Twitch EventSub] Failed to subscribe to ${type}:`, error);
    }
  } catch (e) {
    console.error(`[Twitch EventSub] Error subscribing to ${type}:`, e);
  }
}

async function getTwitchClientId() {
  // Client ID is typically public and can be hardcoded, or fetch from your backend
  // For now, we'll need to add an endpoint to get this securely
  try {
    const response = await fetch(`${API_BASE}/twitch/client-id`);
    const data = await response.json();
    return data.clientId;
  } catch (e) {
    console.error('[Twitch] Failed to get client ID:', e);
    return null;
  }
}

function handleTwitchNotification(payload) {
  const subscription = payload.subscription;
  const event = payload.event;
  
  switch(subscription.type) {
    case 'channel.follow':
      showTwitchAlert('follow', event);
      break;
      
    case 'channel.subscribe':
      showTwitchAlert('subscribe', event);
      break;
      
    case 'channel.subscription.gift':
      showTwitchAlert('subscription.gift', event);
      break;
      
    case 'channel.cheer':
      showTwitchAlert('cheer', event);
      break;
      
    case 'channel.raid':
      showTwitchAlert('raid', event);
      break;
      
    case 'channel.channel_points_custom_reward_redemption.add':
      showTwitchAlert('channel_points', event);
      break;
  }
}

// --- AUDIO PLAYERS ---

function playBase64Audio(base64Data) {
    if (!audioEnabled) { 
        console.warn("[TTS] Audio not yet enabled (click overlay to enable) - attempting playback anyway");
    }
    
    console.log(`[TTS] Decoding base64 audio (${base64Data.length} chars)...`);
    
    return new Promise((resolve) => {
        try {
            const binaryString = atob(base64Data);
            const len = binaryString.length;
            console.log(`[TTS] Binary size: ${len} bytes`);
            
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) { 
                bytes[i] = binaryString.charCodeAt(i); 
            }
            
            const blob = new Blob([bytes], { type: 'audio/mpeg' });
            console.log(`[TTS] Created blob: ${blob.size} bytes, type: ${blob.type}`);
            
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            
            audio.onloadedmetadata = () => {
                console.log(`[TTS] Audio loaded: duration=${audio.duration}s`);
            };
            
            audio.onended = () => { 
                console.log("[TTS] Audio ended naturally");
                URL.revokeObjectURL(url); 
                resolve(); 
            };
            
            audio.onerror = (e) => { 
                console.error("[TTS] Audio playback error:", e, audio.error);
                URL.revokeObjectURL(url); 
                resolve(); 
            };
            
            audio.volume = 1.0; // Ensure volume is max
            audio.play()
                .then(() => console.log("[TTS] Audio.play() started successfully"))
                .catch((err) => {
                    console.error("[TTS] Audio.play() failed:", err);
                    resolve();
                });
        } catch(e) { 
            console.error("[TTS] Base64 decode error:", e);
            resolve(); 
        }
    });
}

async function playAlertSound(sound) {
  if (!audioEnabled) {
      console.warn("[Nexus] Audio disabled - Click the overlay to enable!");
  }
  if (!sound) return;

  // 1. Check for full URL in sound object
  let url = sound.url || null;
  
  // 2. Check for key/id
  const key = sound.key || sound.id || sound.soundKey || ""; 

  if (!url && key) {
    if (key.includes("http")) {
      url = key;
    } else {
      // FIX: Do NOT encodeURIComponent the key if it contains path structure
      url = `${API_BASE}/redeems/sound/${key}`;
    }
  }

  if (!url) return;
  console.log("[Nexus] Playing Sound:", url);

  try {
    const audio = new Audio(url);
    if (sound.volume != null) audio.volume = clamp01(sound.volume);
    
    await audio.play().catch(e => console.warn("[Nexus] Playback Failed (Autoplay blocked?):", e));
  } catch (err) { console.error("Audio Error", err); }
}

// --- QUEUE & COMMANDS ---

function sendTtsCommand(text, voiceId) {
    if (!chatWs || chatWs.readyState !== WebSocket.OPEN) {
        console.warn("[TTS] WebSocket not ready, cannot send command");
        return;
    }
    console.log("[TTS] Sending tts_command to backend:", text.substring(0, 50) + "...");
    chatWs.send(JSON.stringify({ type: "tts_command", text, voiceId: null }));
}

function enqueueEvent(item) {
    talaQueue.push(item);
    if (!processingQueue) processQueue();
}

async function processQueue() {
  if (processingQueue) return;
  processingQueue = true;
  
  while (talaQueue.length > 0) {
    const item = talaQueue.shift();
    
    // Show Overlay for visual feedback
    showOverlay();
    
    if (item.type === "tts") {
        captionEl.textContent = "…";
        sendTtsCommand(item.text, item.voiceId);
        await typeOut(item.text); 
        // Wait for audio to finish (resolved by websocket audio handler)
        await new Promise(resolve => {
            resolveCurrentAudio = resolve; 
            const readingTime = (item.text.length * 100) + 2000;
            setTimeout(() => { if (resolveCurrentAudio) { resolveCurrentAudio(); resolveCurrentAudio = null; } }, Math.min(readingTime, 10000));
        });
  }
    
    await delay(500); // small pause between events
  }
  
  hideOverlay();
  processingQueue = false;
}

// --- WEBSOCKET ---
function connectWebSocket() {
  try { chatWs = new WebSocket(WS_URL); } catch (e) { return; }

  chatWs.onopen = () => {
    console.log("[Nexus] WS Connected to " + WS_URL);
    captionEl.textContent = "Connected";
    showOverlay();
    setTimeout(() => { if (!processingQueue) hideOverlay(); }, 1500);
  };

  chatWs.onmessage = (ev) => {
    let data;
    try { data = JSON.parse(ev.data); } catch { return; }
    
    // -- TTS AUDIO DATA --
    if (data.type === "tts_play_data" && data.audioData) {
        console.log("[TTS] Received audio data, playing...");
        playBase64Audio(data.audioData).then(() => {
            console.log("[TTS] Audio playback complete");
            if (resolveCurrentAudio) { resolveCurrentAudio(); resolveCurrentAudio = null; }
        });
        return;
    }

    // -- AUDIO REDEEMS (Sound only, no visual) --
    if (data.type === "redeem" && data.sound) {
      playAlertSound({ key: data.sound });
      return;
    }

    // -- DIRECT TTS EVENTS (Visual + Audio) --
    if (data.type === "tts") {
      const rawText = (data.input || "").toString().trim();
      if (rawText) {
        console.log("[TTS] Received TTS event, queueing:", rawText.substring(0, 50) + "...");
        triggerVisualFlash();
        enqueueEvent({ type: "tts", text: rawText, voiceId: null });
      }
    }
  };

  chatWs.onclose = () => setTimeout(connectWebSocket, 5000);
}

connectWebSocket();
connectTwitchEventSub();

// Load alert settings from backend
(async function loadAlertSettings() {
  try {
    const response = await fetch(`${API_BASE}/admin/alerts/config`, { credentials: 'include' });
    const data = await response.json();
    if (data.config) {
      Object.assign(alertSettings, data.config);
      console.log('[Alerts] Settings loaded:', alertSettings);
    }
  } catch (e) {
    console.warn('[Alerts] Failed to load settings, using defaults:', e);
  }
})();

// OBS Browser Source Auto-unlock: Try to enable audio immediately
// This works when OBS "Control audio via OBS" is enabled
(async function autoUnlockAudio() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    
    // Play a silent audio buffer to fully unlock audio
    const buffer = ctx.createBuffer(1, 1, 22050);
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(ctx.destination);
    source.start();
    
    audioEnabled = true;
    console.log("[Nexus] Audio auto-unlocked for OBS");
    
    // Hide the prompt since audio is working
    const prompt = document.getElementById("audioPrompt");
    if (prompt) {
      prompt.classList.add("hidden");
      setTimeout(() => prompt.remove(), 300);
    }
  } catch (e) {
    console.warn("[Nexus] Audio auto-unlock failed, waiting for user interaction:", e);
  }
})();

// Fallback: Enable audio on any click/touch (if auto-unlock fails)
document.addEventListener('click', enableAudio);
document.addEventListener('touchstart', enableAudio);
</script>
