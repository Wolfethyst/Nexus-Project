name = "nexus-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[env.production]
routes = [{ pattern = "nexus.wolfethyst.tv/api/*", zone_id = "81845f9b6a8496a989cbe0ba6a78ddc7" }]

[[d1_databases]]
binding = "DB"
database_name = "nexus"

[[kv_namespaces]]
binding = "KV"
id = "your-kv-id"
preview_id = "your-preview-kv-id"

[[r2_buckets]]
binding = "R2"
bucket_name = "nexus-assets"
preview_bucket_name = "nexus-assets-preview"

[build]
command = "pnpm -r build"
cwd = "../.."

[build.upload]
main = "./dist/index.js"
