<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nexus – Video Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script defer src="https://embed.cloudflarestream.com/embed/ujsnowflakes.min.js"></script>
  <style>
    :root {
      --bg: #090013;
      --bg-card: #150026;
      --bg-card-alt: #1c0033;
      --accent: #d875ff;
      --accent-glow: rgba(216, 117, 255, 0.4);
      --text: #f5e9ff;
      --muted: #bba3d9;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #2c0a59 0, #090013 60%, #020007 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .shell { width: 100%; max-width: 1200px; }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    
    .brand h1 { margin: 0; font-size: 1.5rem; letter-spacing: 0.05em; text-transform: uppercase; color: #fff; text-shadow: 0 0 20px var(--accent-glow); }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }

    /* BREADCRUMB NAV */
    .nav-bar { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
    .nav-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 5px; }
    .nav-btn:hover { color: var(--accent); }
    .nav-btn.active { color: var(--accent); cursor: default; }
    .nav-arrow { opacity: 0.5; font-size: 10px; }

    /* PLAYER STAGE */
    .stage {
      display: grid;
      grid-template-columns: 2.5fr 1fr;
      gap: 24px;
      margin-bottom: 40px;
      animation: fadeIn 0.5s ease;
    }
    @media (max-width: 900px) { .stage { grid-template-columns: 1fr; } }

    .video-container {
      position: relative;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }
    video { width: 100%; height: 100%; outline: none; }

    .meta-panel {
      background: linear-gradient(160deg, var(--bg-card), var(--bg-card-alt));
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .meta-title { font-size: 1.5rem; margin: 0 0 8px; line-height: 1.2; }
    .meta-date { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    .btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text);
      padding: 10px 16px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { background: rgba(255,255,255,0.1); border-color: var(--text); }
    .btn.primary { background: var(--accent); color: #1a002e; border: none; font-weight: 600; }
    .btn.primary:hover { opacity: 0.9; }

    /* GAMES GRID */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .game-card {
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: all 0.2s;
      cursor: pointer;
      position: relative;
      aspect-ratio: 2/3;
    }
    .game-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .game-card img { width: 100%; height: 100%; object-fit: cover; }
    .game-title-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      padding: 20px 10px 10px;
      font-size: 14px; font-weight: bold; text-align: center;
      opacity: 0; transition: 0.2s;
    }
    .game-card:hover .game-title-overlay { opacity: 1; }

    /* GAME HEADER (DRILL DOWN) */
    .game-hero {
      display: flex; gap: 24px; align-items: flex-end;
      margin-bottom: 30px; padding: 30px;
      background: linear-gradient(90deg, rgba(20,0,40,0.5), transparent);
      border-radius: var(--radius); border: 1px solid var(--border);
    }
    .game-hero-cover { width: 120px; height: 180px; border-radius: 8px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.5); flex-shrink: 0; }
    .game-hero-info h2 { margin: 0 0 10px; font-size: 2.5rem; text-shadow: 0 0 20px var(--accent-glow); line-height: 1; }
    .game-hero-stats { display: flex; gap: 20px; color: var(--muted); font-size: 14px; }

    /* SUB TABS */
    .sub-tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .sub-tab { padding: 10px 0; background: none; border: none; color: var(--muted); font-size: 16px; font-weight: 600; cursor: pointer; position: relative; }
    .sub-tab.active { color: #fff; }
    .sub-tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 3px; background: var(--accent); border-radius: 3px 3px 0 0; }

    /* VIDEOS GRID */
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); transition: transform 0.2s; cursor: pointer; }
    .card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .card-thumb { aspect-ratio: 16/9; background: #000; position: relative; }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
    .card-dur { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
    .provider-badge { font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.6); color: #fff; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.1); }
    .card-body { padding: 12px; }
    .card-title { font-weight: 600; margin-bottom: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .card-date { font-size: 0.8rem; color: var(--muted); }

    .hidden { display: none !important; }
    .empty-state { text-align: center; padding: 60px; color: var(--muted); font-style: italic; width: 100%; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="shell">
  <header>
    <div class="brand">
      <h1>Nexus Video Hub</h1>
    </div>
    <div class="nav-bar">
      <button class="nav-btn active" id="nav-home" onclick="goHome()">All Games</button>
      <span class="nav-arrow hidden" id="nav-arrow">▶</span>
      <span class="nav-btn" id="nav-game-title"></span>
    </div>
  </header>

  <div id="stage" class="stage hidden">
    <div class="video-container">
      <video id="main-player" controls crossorigin="anonymous"></video>
    </div>
    <div class="meta-panel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <h2 id="meta-title" class="meta-title">Select a video</h2>
            <div id="meta-date" class="meta-date">--</div>
          </div>
          <button class="btn" onclick="closePlayer()">Close Player</button>
      </div>
      <div style="margin-top: 16px;">
        <label for="videoQualitySelect" style="display: block; font-size: 0.9rem; margin-bottom: 6px; color: var(--muted);">Quality:</label>
        <select id="videoQualitySelect" style="width: 100%; padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.9rem; display: none;">
          <option value="auto">Auto (Recommended)</option>
        </select>
      </div>
      <div class="actions">
        <a id="btn-download" href="#" class="btn primary" download>Download</a>
      </div>
    </div>
  </div>

  <div id="view-games">
    <div id="games-grid" class="games-grid"></div>
    <div id="games-loading" class="empty-state">Loading library...</div>
  </div>

  <div id="view-game-details" class="hidden">
    <div class="game-hero">
      <img id="gh-cover" class="game-hero-cover" src="">
      <div class="game-hero-info">
        <h2 id="gh-title">Game Title</h2>
        <div class="game-hero-stats">
          <span id="gh-vods-count">0 VODs</span> • 
          <span id="gh-clips-count">0 Clips</span>
        </div>
      </div>
    </div>

    <div class="sub-tabs">
      <button class="sub-tab active" onclick="switchSubTab('vods')">VODs</button>
      <button class="sub-tab" onclick="switchSubTab('videos')">Videos</button>
      <button class="sub-tab" onclick="switchSubTab('clips')">Clips</button>
    </div>

    <div id="content-vods" class="video-grid"></div>
    <div id="content-videos" class="video-grid hidden"><div class="empty-state">No uploaded videos yet.</div></div>
    <div id="content-clips" class="video-grid hidden"></div>
  </div>

</div>

<script>
  // CONFIG
  const API_BASE = "https://data.wolfethyst.tv";
  const BUNNY_HOSTNAME = "vz-564d87dc-3df.b-cdn.net"; 
  const CLOUDFLARE_CUSTOMER = "gc5hjo8ti1eiebgs";       
  const PLACEHOLDER_IMG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360'%3E%3Crect width='640' height='360' fill='%23222'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='24' fill='%23555'%3EProcessing%3C/text%3E%3C/svg%3E";

  // STATE
  let allGames = [];
  let allVods = [];
  let allClips = [];
  let selectedGame = null;
  const player = document.getElementById('main-player');
  const hls = new Hls(); 

  // INIT
  async function init() {
    await Promise.all([loadGames(), loadVods(), loadClips()]);
    renderGamesGrid();
    
    // Check URL param for deep link
    const params = new URLSearchParams(window.location.search);
    if(params.get('game')) {
        const target = allGames.find(g => g.name === params.get('game'));
        if(target) selectGame(target);
    }
  }

  // DATA FETCHING
  async function loadGames() {
    try {
      const res = await fetch(`${API_BASE}/played`);
      const data = await res.json();
      allGames = data.games || [];
    } catch(e) { console.error("Games error", e); }
  }

  async function loadVods() {
    try {
      const res = await fetch(`${API_BASE}/streams/list`);
      const data = await res.json();
      allVods = data.streams || [];
    } catch(e) { console.error("VODs error", e); }
  }

  async function loadClips() {
    try {
      const res = await fetch(`${API_BASE}/clips/list`);
      const data = await res.json();
      allClips = data.clips || [];
    } catch(e) { console.error("Clips error", e); }
  }

  // RENDERERS
  function renderGamesGrid() {
    const grid = document.getElementById('games-grid');
    document.getElementById('games-loading').classList.add('hidden');
    grid.innerHTML = allGames.map(g => `
      <div class="game-card" onclick="selectGameByName('${escapeHtml(g.name)}')">
        <img src="${g.cover}" loading="lazy">
        <div class="game-title-overlay">${escapeHtml(g.name)}</div>
      </div>
    `).join('');
  }

  window.selectGameByName = (name) => {
      const game = allGames.find(g => g.name === name);
      if(game) selectGame(game);
  };

  function selectGame(game) {
    selectedGame = game;
    
    // Update Nav
    document.getElementById('view-games').classList.add('hidden');
    document.getElementById('view-game-details').classList.remove('hidden');
    document.getElementById('nav-home').classList.remove('active');
    document.getElementById('nav-arrow').classList.remove('hidden');
    document.getElementById('nav-game-title').innerText = game.name;
    
    // Update Hero
    document.getElementById('gh-cover').src = game.cover;
    document.getElementById('gh-title').innerText = game.name;

    // Filter Content (Fuzzy Match Title)
    const gameVods = allVods.filter(v => (v.title || "").toLowerCase().includes(game.name.toLowerCase()));
    const gameClips = allClips.filter(c => (c.title || "").toLowerCase().includes(game.name.toLowerCase()));

    // Update Counts
    document.getElementById('gh-vods-count').innerText = `${gameVods.length} VODs`;
    document.getElementById('gh-clips-count').innerText = `${gameClips.length} Clips`;

    // Render Grids
    renderContentGrid('content-vods', gameVods, 'vod');
    renderContentGrid('content-clips', gameClips, 'clip');
    
    // Default Tab
    switchSubTab('vods');
  }

  function renderContentGrid(containerId, items, type) {
    const container = document.getElementById(containerId);
    if(items.length === 0) {
        container.innerHTML = `<div class="empty-state">No ${type}s found for this game.</div>`;
        return;
    }
    
    container.innerHTML = items.map(item => {
      let thumbUrl = "";
      if (type === 'vod') thumbUrl = `https://${BUNNY_HOSTNAME}/${item.id}/thumbnail.jpg`;
      else thumbUrl = item.bunnyId ? `https://${BUNNY_HOSTNAME}/${item.bunnyId}/thumbnail.jpg` : PLACEHOLDER_IMG;

      const dateStr = new Date(item.createdAt || item.created_at).toLocaleDateString();
      
      // JSON.stringify for cleaner onclick data passing
      const itemJson = JSON.stringify(item).replace(/"/g, '&quot;');

      return `
        <div class="card" onclick="playItem(${itemJson}, '${type}')">
          <div class="card-thumb">
             <img src="${thumbUrl}" onerror="this.src='${PLACEHOLDER_IMG}'">
             <div class="provider-badge">${type.toUpperCase()}</div>
             <div class="card-dur">${item.duration || "CLIP"}</div>
          </div>
          <div class="card-body">
             <div class="card-title">${item.title}</div>
             <div class="card-date">${dateStr}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  window.goHome = () => {
    document.getElementById('view-games').classList.remove('hidden');
    document.getElementById('view-game-details').classList.add('hidden');
    document.getElementById('nav-home').classList.add('active');
    document.getElementById('nav-arrow').classList.add('hidden');
    document.getElementById('nav-game-title').innerText = "";
    closePlayer();
  };

  window.switchSubTab = (tab) => {
    document.querySelectorAll('.sub-tab').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    ['vods', 'videos', 'clips'].forEach(t => {
        const el = document.getElementById(`content-${t}`);
        if(t === tab) el.classList.remove('hidden');
        else el.classList.add('hidden');
    });
  };

  window.playItem = (item, type) => {
    document.getElementById('stage').classList.remove('hidden');
    document.getElementById('meta-title').innerText = item.title;
    document.getElementById('meta-date').innerText = new Date(item.createdAt || item.created_at).toLocaleString();

    const bunnyId = item.bunnyId || (type === 'vod' ? item.id : null);
    let playUrl = "", dlUrl = "";
    let isHls = false;

    if (bunnyId) {
        playUrl = `https://${BUNNY_HOSTNAME}/${bunnyId}/playlist.m3u8`;
        dlUrl = `https://${BUNNY_HOSTNAME}/${bunnyId}/play_720p.mp4`; 
        isHls = true;
    } else {
        playUrl = item.url; dlUrl = item.url; isHls = false;
    }

    if (isHls && Hls.isSupported()) {
        hls.loadSource(playUrl); hls.attachMedia(player);
    } else {
        if(isHls) hls.detachMedia(); player.src = playUrl;
    }
    
    document.getElementById('btn-download').href = dlUrl;
    player.play();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.closePlayer = () => {
      document.getElementById('stage').classList.add('hidden');
      player.pause(); player.src = "";
  };

  function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }

  init();
</script>
</body>
</html>
